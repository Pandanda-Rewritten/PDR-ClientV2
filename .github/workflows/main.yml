name: Build PDR-ClientV2

on:
  push:
    branches: 
       - production

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: microsoft/setup-msbuild@v2
      - name: Install dependencies
        run: yarn --frozen-lockfile
      - name: Build (make)
        run: yarn make
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-make
          path: out/make/**

  mac:
    name: macOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies (skip optional native deps)
        run: yarn --frozen-lockfile --ignore-optional
      - name: Build (make)
        run: yarn make
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-make
          path: out/make/**

  linux:
    name: Linux build
    runs-on: ubuntu-latest
    env:
      NODE_PATH: ${{ env.HOME }}/.config/yarn/global/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install system deps for makers
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm flatpak flatpak-builder elfutils
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform/x86_64/22.08 org.freedesktop.Sdk/x86_64/22.08 org.electronjs.Electron2.BaseApp/x86_64/22.08
          git config --global --add protocol.file.allow always

      - name: Install dependencies (skip optional native deps)
        run: yarn --frozen-lockfile --ignore-optional

      - name: Install Linux maker node deps (global)
        run: yarn global add electron-installer-debian electron-installer-redhat @malept/electron-installer-flatpak

      - name: Build (make)
        run: yarn make

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-make
          path: out/make/**
